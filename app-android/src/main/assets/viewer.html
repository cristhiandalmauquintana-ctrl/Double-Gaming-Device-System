<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DGDS</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #cfd8dc;
               font-family: system-ui, sans-serif; overflow: hidden; }
  #v { width: 100%; height: 100%; object-fit: contain; display: block;
       user-select: none; -webkit-user-drag: none; touch-action: none; }
  #v.ctl { cursor: crosshair; }
  #msg { position: fixed; left: 12px; top: 10px; font-size: 14px; }
  #bar { position: fixed; top: 8px; right: 8px; display: flex; gap: 8px;
         opacity: .9; transition: opacity .4s; }
  #bar.hide { opacity: 0; }
  button { background: #12304d; color: #fff; border: 1px solid #1e90ff;
           border-radius: 6px; padding: 6px 12px; cursor: pointer; }
</style>
</head>
<body>
<img id="v" alt="" draggable="false">
<div id="msg">Conectando…</div>
<div id="bar">
  <button id="ctrl">Activar controles</button>
  <button id="reconnect">Reconectar</button>
  <button id="fs">Pantalla completa</button>
</div>
<script>
  const v = document.getElementById('v');
  const msg = document.getElementById('msg');
  const bar = document.getElementById('bar');
  const ctrl = document.getElementById('ctrl');
  let retry, ws = null, dragging = false, raf = 0, lastPt = null;

  // ---- Video ----
  function connect() {
    clearTimeout(retry);
    msg.textContent = 'Conectando…';
    v.src = '/stream?' + Date.now();
  }
  v.onload = () => { if (msg.textContent === 'Conectando…') msg.textContent = ''; };
  v.onerror = () => {
    msg.textContent = 'Sin señal. Reintentando…';
    retry = setTimeout(connect, 1000);
  };
  document.getElementById('reconnect').onclick = connect;
  document.getElementById('fs').onclick = () =>
    document.fullscreenElement ? document.exitFullscreen()
                               : document.documentElement.requestFullscreen();

  let hideTimer;
  document.onmousemove = () => {
    bar.classList.remove('hide');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => bar.classList.add('hide'), 2500);
  };

  // ---- Controles ----
  function send(kind, p) {
    if (ws && ws.readyState === 1) ws.send(kind + ',' + p[0].toFixed(4) + ',' + p[1].toFixed(4));
  }

  // Posición del puntero sobre la imagen (0 a 1), descontando las barras negras.
  function point(e, clampIt) {
    const iw = v.naturalWidth, ih = v.naturalHeight;
    if (!iw || !ih) return null;
    const r = v.getBoundingClientRect();
    const scale = Math.min(r.width / iw, r.height / ih);
    const dw = iw * scale, dh = ih * scale;
    const ox = r.left + (r.width - dw) / 2, oy = r.top + (r.height - dh) / 2;
    let x = (e.clientX - ox) / dw, y = (e.clientY - oy) / dh;
    if (clampIt) return [Math.min(1, Math.max(0, x)), Math.min(1, Math.max(0, y))];
    return (x < 0 || x > 1 || y < 0 || y > 1) ? null : [x, y];
  }

  ctrl.onclick = () => {
    if (ws) { ws.close(); return; }
    const pin = prompt('Escribe el PIN que aparece en la app del teléfono:');
    if (!pin) return;
    let opened = false;
    const sock = new WebSocket('ws://' + location.host + '/control?pin=' + encodeURIComponent(pin.trim()));
    ws = sock;
    sock.onopen = () => {
      opened = true;
      ctrl.textContent = 'Desactivar controles';
      v.classList.add('ctl');
      msg.textContent = 'Controles activos';
      setTimeout(() => { if (msg.textContent === 'Controles activos') msg.textContent = ''; }, 2500);
    };
    sock.onmessage = (ev) => {
      if (ev.data === 'noservice') msg.textContent = 'Falta activar los controles en el teléfono (Accesibilidad).';
    };
    sock.onclose = () => {
      if (ws === sock) ws = null;
      dragging = false;
      ctrl.textContent = 'Activar controles';
      v.classList.remove('ctl');
      if (!opened) msg.textContent = 'No se pudo activar. Revisa el PIN (tras 5 fallos hay que reiniciar la transmisión).';
    };
  };

  v.addEventListener('pointerdown', (e) => {
    if (!ws || ws.readyState !== 1 || !e.isPrimary) return;
    const p = point(e, false);
    if (!p) return;
    dragging = true;
    v.setPointerCapture(e.pointerId);
    send('d', p);
    e.preventDefault();
  });
  v.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    lastPt = point(e, true);
    if (!raf) raf = requestAnimationFrame(() => {
      raf = 0;
      if (dragging && lastPt) send('m', lastPt);
    });
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    const p = point(e, true) || lastPt;
    if (p) send('u', p);
  }
  v.addEventListener('pointerup', endDrag);
  v.addEventListener('pointercancel', endDrag);

  connect();
</script>
</body>
</html>
